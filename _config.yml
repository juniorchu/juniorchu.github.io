# The Site Configuration

theme: jekyll-theme-chirpy

lang: ko

timezone: ""

title: 제이씨코포레이션 기술 블로그
tagline: EUTECH Microelectronics, GSTEK, IDESYN, M3TEK, NSIWAY, RYCHIP 대리점
description: EUTECH Microelectronics, GSTEK, IDESYN, M3TEK, NSIWAY, RYCHIP 등 국내 공식 대리점 (주)제이씨코포레이션의 기술 자료 및 부품 스펙 정보 블로그입니다.

url: "https://juniorchu.github.io"

github:
  username: juniorchu

twitter:
  username: twitter_username

social:
  name: "(주)제이씨코포레이션"
  email: juniorchu@gmail.com
  links:
    - https://twitter.com/username
    - https://github.com/username

webmaster_verifications:
  google: ""
  bing: ""
  alexa: ""
  yandex: ""
  baidu: ""
  facebook: ""

analytics:
  google:
    id: ""

pageviews:
  provider: ""

theme_mode: ""

cdn: ""

avatar: /assets/img/jclogo.png

social_preview_image: /assets/img/jclogo.png

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: ""

assets:
  self_host:
    enabled: false

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

favicon:
  mstile_150x150: /assets/img/jclogo.png
  apple_touch_icon: /assets/img/jclogo.png
  favicon_32x32: /assets/img/jclogo.png
  favicon_16x16: /assets/img/jclogo.png
